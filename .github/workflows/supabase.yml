name: Supabase CI/CD
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Em pull request NÃO se toca no banco: só confere os arquivos de migration.
  validar:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Conferir arquivos de migration
        run: |
          set -euo pipefail
          diretorio=supabase/migrations
          falhas=0

          for arquivo in "$diretorio"/*.sql; do
            nome=$(basename "$arquivo")
            if ! printf '%s' "$nome" | grep -qE '^[0-9]{12,14}_[A-Za-z0-9_]+\.sql$'; then
              echo "::error file=$arquivo::Nome fora do padrão AAAAMMDDHHMMSS_descricao.sql"
              falhas=1
            fi
            if [ ! -s "$arquivo" ]; then
              echo "::error file=$arquivo::Migration vazia"
              falhas=1
            fi
          done

          duplicados=$(ls "$diretorio" | sed -E 's/_.*//' | sort | uniq -d)
          if [ -n "$duplicados" ]; then
            echo "::error::Prefixos de migration duplicados: $duplicados"
            falhas=1
          fi

          [ "$falhas" -eq 0 ]
          echo "Migrations conferidas: $(ls "$diretorio"/*.sql | wc -l)"

      - name: Aviso sobre aplicação das migrations
        run: |
          echo "As migrations só são aplicadas no banco após o merge em main."

  deploy:
    # Só aplica no banco de produção depois do merge em main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      # Instala a Supabase CLI baixando o binário oficial (forma suportada)
      - name: Instalar Supabase CLI (binary)
        run: |
          curl -L https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          sudo tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin supabase
          supabase --version
      
      - name: Linkar projeto Supabase
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      
      # Sem --remote: por padrão empurra para o projeto linkado
      - name: Aplicar migrations no banco remoto
        run: supabase db push --yes
      
      - name: Deploy edge functions (optional)
        run: supabase functions deploy --project-ref "$PROJECT_REF" || true
      
      - name: Gerar Types para Front_Web
        run: |
          mkdir -p Front_Web/src/lib
          supabase gen types typescript --project-id "$PROJECT_REF" --schema financas > Front_Web/src/lib/database.types.ts
